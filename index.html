<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>나라장터 공고 바로가기</title>
<style>
body{margin:0;padding:48px 20px;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:16px;line-height:1.6;color:#18202b;background:#fff;text-align:center}
a{color:#1f6fb2;word-break:break-all}
</style>
</head>
<body>
<p id="msg">나라장터 공고로 이동합니다.</p>
<p><a id="go" href="https://www.g2b.go.kr/">나라장터 열기</a></p>
<script>
// 윈도우 엑셀 링크가 나라장터에 막히지 않게 거치는 페이지. 공고번호로 나라장터 공식 주소만 만들어 이동하고, 다른 주소로는 보내지 않는다.
(function () {
  var q = new URLSearchParams(location.search), b = q.get("b"), o = q.get("o") || "000", p = q.get("p"), url = "";
  if (b && /^[A-Z]\d{2}BK\d{8}$/.test(b) && /^\d{3}$/.test(o)) url = "https://www.g2b.go.kr/link/PNPE027_01/single/?bidPbancNo=" + b + "&bidPbancOrd=" + o;
  else if (p && /^[A-Z]\d{2}BD\d{8}$/.test(p)) url = "https://www.g2b.go.kr/link/PRVA004_02/single/?bfSpecRegNo=" + p;
  var go = document.getElementById("go");
  if (!url) { document.getElementById("msg").textContent = "공고번호를 확인할 수 없습니다."; return; }
  go.href = url; go.textContent = url;
  location.replace(url);
})();
</script>
</body>
</html>
